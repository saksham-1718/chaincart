{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shipping Address - ChainCart</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <header>
    <div class="container header-content">
      <a href="{% url 'home' %}" class="logo">ChainCart</a>
    </div>
  </header>

  <div class="container checkout two-column">
    <!-- Sidebar steps -->
    <aside class="checkout-steps">
      <ol>
        <li class="step-item">
          <a href="{% url 'order-summary' %}">
            <span class="step-num">1</span>
            <div class="step-title">Order Summary</div>
          </a>
        </li>
        <li class="step-item active">
          <a href="{% url 'address' %}">
            <span class="step-num">2</span>
            <div class="step-title">Shipping Address</div>
          </a>
        </li>
        <li class="step-item">
          <a href="{% url 'review' %}">
            <span class="step-num">3</span>
            <div class="step-title">Review & Place</div>
          </a>
        </li>
        <li class="step-item">
          <a href="{% url 'payment-mode' %}">
            <span class="step-num">4</span>
            <div class="step-title">Payment</div>
          </a>
        </li>
        <li class="step-item">
          <a href="{% url 'confirmation' %}">
            <span class="step-num">5</span>
            <div class="step-title">Confirmation</div>
          </a>
        </li>
      </ol>
    </aside>

    <!-- Main Content -->
    <main class="checkout-main">
      <h2>Shipping Address</h2>

      <form method="POST" id="address-form" class="address-form">
        {% csrf_token %}

        <label class="full">
          Full Name
          <input type="text" name="name" value="{{ shipping.name|default_if_none:'' }}" required>
        </label>

        <label>
          Phone
          <input type="text" name="phone" value="{{ shipping.phone|default_if_none:'' }}" inputmode="tel" required>
        </label>

        <label class="full">
          Address Line 1
          <input type="text" name="address" value="{{ shipping.address|default_if_none:'' }}" required>
        </label>

        <label>
          City
          <input type="text" name="city" value="{{ shipping.city|default_if_none:'' }}" required>
        </label>

        <label>
          State/Region
          <input type="text" name="state" value="{{ shipping.state|default_if_none:'' }}" required>
        </label>

        <label>
          Pincode/ZIP
          <input type="text" name="pincode" value="{{ shipping.pincode|default_if_none:'' }}" inputmode="numeric" required>
        </label>

        <div class="checkout-actions">
          <a href="{% url 'order-summary' %}" class="btn secondary">Back</a>
          <button type="submit" class="btn primary">Continue to Review</button>
        </div>
      </form>
    </main>
  </div>

  <script src="{% static 'checkout.js' %}"></script>
  <script src="{% static 'script.js' %}"></script>
</body>
</html>

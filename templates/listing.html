{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Artwork - ChainCart</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style> 
    .artwork-form-section {
         background: #fff; 
         padding: 40px; 
         border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); max-width: 980px; margin: 20px auto 40px; border: 1px solid #f0f0f0; } .artwork-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; } .form-group { margin-bottom: 20px; } .form-group.full-width { grid-column: 1 / -1; } .artwork-form-section label { display: block; margin-bottom: 8px; color: var(--dark); font-weight: 600; } .artwork-form-section input[type="text"], .artwork-form-section input[type="number"], .artwork-form-section input[type="file"], .artwork-form-section select, .artwork-form-section textarea { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #e8e8e8; background: #fff; font-size: 15px; color: #222; transition: box-shadow 160ms ease, border-color 160ms ease; } .artwork-form-section input:focus, .artwork-form-section select:focus, .artwork-form-section textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 8px 20px rgba(139,69,19,0.08); } .artwork-form-section textarea { resize: vertical; min-height: 120px; } .artwork-preview { width: 100%; height: 200px; border: 2px dashed #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--gray); margin-top: 8px; } .artwork-preview img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; } .form-actions { grid-column: 1 / -1; display: flex; gap: 16px; justify-content: flex-end; margin-top: 20px; } .main-content { padding-top: 40px; } .page-title { margin-bottom: 20px; } .page-description { color: var(--gray); margin-bottom: 30px; } .submit-btn { background: var(--primary); } @media (max-width: 768px) { .artwork-form-grid { grid-template-columns: 1fr; } .artwork-form-section { padding: 20px; margin: 10px; } } </style>
         
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container header-content">
            <a href="{% url 'home' %}" class="logo">ChainCart</a>
            <nav>
                <ul>
                    <li><a href="{% url 'home' %}">Home</a></li>
                    <li><a href="{% url 'digital-art' %}">Digital Art</a></li>
                    <li><a href="{% url 'sculpture' %}">Sculptures</a></li>
                    <li><a href="{% url 'photography' %}">Photography</a></li>
                    <li><a href="{% url 'cart' %}">Cart</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container main-content">
        <h1>Submit Your Artwork</h1>
        <p>Complete the form below to submit your artwork for sale on ChainCart.</p>

        <div class="artwork-form-section">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="artwork-form-grid">

                    <div class="form-group">
                        <label>Artwork Title*</label>
                        <input type="text" name="title" required>
                    </div>
                     <div class="form-group">
                        <label>Artist Name*</label>
                        <input type="text" name="aname" required>
                    </div>
                    <div class="form-group">
                        <label>Category*</label>
                        <select name="category" required>
                            <option value="">Select a category</option>
                            <option value="painting">Painting</option>
                            <option value="digital-art">Digital Art</option>
                            <option value="sculpture">Sculpture</option>
                            <option value="photography">Photography</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Price*</label>
                        <input type="number" step="0.01" name="price" required>
                    </div>

                    <div class="form-group">
                        <label>Medium/Material*</label>
                        <input type="text" name="medium" required>
                    </div>

                    <div class="form-group">
                        <label>Dimensions</label>
                        <input type="text" name="dimensions">
                    </div>

                    <div class="form-group">
                        <label>Year Created*</label>
                        <input type="number" name="year" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Artwork Image*</label>
                        <input type="file" name="artwork_image" accept="image/*" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Description*</label>
                        <textarea name="description" required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Edition Details</label>
                        <input type="text" name="edition">
                    </div>

                    <div class="form-group">
                        <label>Condition*</label>
                        <select name="condition" required>
                            <option value="">Select condition</option>
                            <option value="new">New</option>
                            <option value="excellent">Excellent</option>
                            <option value="good">Good</option>
                            <option value="fair">Fair</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Shipping Information</label>
                        <textarea name="shipping"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn submit-btn">Submit Artwork</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2025 ChainCart. All rights reserved.</p>
    </footer>
</body>
</html>
